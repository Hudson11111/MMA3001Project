# Dataset configuration — Roboflow Universe "Pork Rasher Error(Packaging)", v4.
# Secrets (API keys) never go in this file; see porkqc.env.get_secret.

roboflow:
  workspace: hello-2aqe0
  project: pork-rasher-error-packaging
  version: 4
  export_format: yolov8        # same layout as YOLO11/YOLO26 exports (DECISION_LOG D-015)

# Class names in class-id order. Checked against the downloaded data.yaml.
class_names:
  - loose-meat
  - packaging-error
  - twisted-meat
  - unsealed
  - wrinkle

# Values published on the Roboflow page, used as sanity checks after download.
expected:
  image_width: 720
  image_height: 540
  split_counts:
    train: 3349
    valid: 120
    test: 80

paths:
  colab_data_dir: /content/data/pork-rasher-v4
  drive_project_dir: /content/drive/MyDrive/MMA3001Project   # runs/weights persist here

# Time-blocked re-split (DECISION_LOG D-008). Frames are video frames, so the
# random Roboflow split puts the same tray in several splits. Values are
# provisional until notebook 01 measures how many frames one tray stays in view.
blocked_split:
  block_size: 300          # frames per block assigned as a whole to one split
  gap: 50                  # purge: no two kept frames from different splits within 50 frames
  fractions: [0.7, 0.15, 0.15]
  seed: 0
  colab_dir: /content/data/pork-rasher-v4-blocked
