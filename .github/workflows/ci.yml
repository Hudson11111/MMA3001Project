name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools (no GPU / dataset needed)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: >
          python -m pytest
          --cov=porkqc --cov-report=term-missing
          --html=reports/test_report.html --self-contained-html
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python-version }}
          path: reports/test_report.html
